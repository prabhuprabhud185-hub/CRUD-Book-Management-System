
<!DOCTYPE html>
<html>
<head>
    <title>Update Book</title>
</head>
<body>

    <h1>Update Book Price</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Book Title:</label>
        <input type="text"
               value="{{ book.title }}"
               readonly>
        <br><br>

        <label>Author:</label>
        <input type="text"
               value="{{ book.author }}"
               readonly>
        <br><br>

        <label>Price:</label>
        <input type="number"
               name="price"
               value="{{ book.price }}"
               required>
        <br><br>

        <button type="submit">Update Price</button>
    </form>

    <br>

    <a href="{% url 'book_list' %}">Back to Home</a>

</body>
</html>
